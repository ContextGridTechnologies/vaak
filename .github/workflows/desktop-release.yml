name: Desktop Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  windows-installer:
    name: Build Windows Installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install desktop dependencies
        run: npm --prefix apps/desktop ci

      - name: Verify release versions
        shell: pwsh
        run: |
          $tagVersion = $env:GITHUB_REF_NAME -replace '^v', ''
          $package = Get-Content -Raw -LiteralPath "apps/desktop/package.json" | ConvertFrom-Json
          $tauri = Get-Content -Raw -LiteralPath "apps/desktop/src-tauri/tauri.conf.json" | ConvertFrom-Json

          if ($package.version -ne $tagVersion) {
            throw "Tag version v$tagVersion does not match apps/desktop/package.json version $($package.version)."
          }

          if ($tauri.version -ne $tagVersion) {
            throw "Tag version v$tagVersion does not match apps/desktop/src-tauri/tauri.conf.json version $($tauri.version)."
          }

      - name: Install NSIS
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis -y --no-progress
          }

          $nsisDirs = @(
            "$env:ProgramFiles\NSIS",
            "${env:ProgramFiles(x86)}\NSIS"
          )

          foreach ($dir in $nsisDirs) {
            if (Test-Path $dir) {
              Add-Content -Path $env:GITHUB_PATH -Value $dir
              $env:PATH = "$dir;$env:PATH"
            }
          }

          makensis /VERSION

      - name: Build Windows installer and signed updater artifacts
        run: npm --prefix apps/desktop run tauri build -- --ci --bundles nsis
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          VITE_POSTHOG_PUBLIC_KEY: ${{ secrets.VITE_POSTHOG_PUBLIC_KEY }}
          VITE_POSTHOG_HOST: ${{ secrets.VITE_POSTHOG_HOST || 'https://us.i.posthog.com' }}

      - name: Normalize release asset names
        shell: pwsh
        run: |
          $bundleDir = "apps/desktop/src-tauri/target/release/bundle/nsis"
          $installer = Get-ChildItem -Path $bundleDir -Filter "*.exe" |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if (-not $installer) {
            throw "No NSIS installer was found."
          }

          Copy-Item -LiteralPath $installer.FullName -Destination "Vaak-Windows-Setup.exe" -Force

          $updaterPackage = Get-ChildItem -Path $bundleDir -Filter "*.zip" |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if (-not $updaterPackage) {
            throw "No updater package was found."
          }

          $signaturePath = "$($updaterPackage.FullName).sig"
          if (-not (Test-Path -LiteralPath $signaturePath)) {
            throw "No updater signature was found for $($updaterPackage.Name)."
          }

          Copy-Item -LiteralPath $updaterPackage.FullName -Destination "Vaak-Windows-Setup.nsis.zip" -Force
          Copy-Item -LiteralPath $signaturePath -Destination "Vaak-Windows-Setup.nsis.zip.sig" -Force

      - name: Generate updater metadata
        shell: pwsh
        run: |
          $tagVersion = $env:GITHUB_REF_NAME -replace '^v', ''
          $updaterAsset = "Vaak-Windows-Setup.nsis.zip"
          $signature = (Get-Content -Raw -LiteralPath "$updaterAsset.sig").Trim()
          $assetUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:GITHUB_REF_NAME/$updaterAsset"
          $metadata = @{
            version = $tagVersion
            notes = "Vaak $tagVersion"
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{
              "windows-x86_64" = @{
                signature = $signature
                url = $assetUrl
              }
            }
          }

          $metadata | ConvertTo-Json -Depth 5 | Set-Content -Path "latest.json" -Encoding utf8

      - name: Generate installer checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash -LiteralPath "Vaak-Windows-Setup.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Vaak-Windows-Setup.exe" | Set-Content -Path "Vaak-Windows-Setup.exe.sha256" -Encoding ascii

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Vaak-Windows-Setup.exe
            Vaak-Windows-Setup.exe.sha256
            Vaak-Windows-Setup.nsis.zip
            Vaak-Windows-Setup.nsis.zip.sig
            latest.json
          fail_on_unmatched_files: true
          overwrite_files: true
          make_latest: true
