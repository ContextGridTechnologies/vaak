name: Desktop CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install desktop dependencies
        run: npm --prefix apps/desktop ci

      - name: Check macOS workflow invariants
        run: npm run check:macos-workflows

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm --prefix apps/desktop run lint

      - name: Test
        run: npm run test

  windows-tauri:
    name: Windows Cargo Check And Build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install desktop dependencies
        run: npm --prefix apps/desktop ci

      - name: Cargo check
        run: cargo check
        working-directory: apps/desktop/src-tauri

      - name: Build desktop app
        run: npm --prefix apps/desktop run tauri build -- --ci --no-bundle
        env:
          VITE_POSTHOG_PUBLIC_KEY: ${{ secrets.VITE_POSTHOG_PUBLIC_KEY }}
          VITE_POSTHOG_HOST: ${{ secrets.VITE_POSTHOG_HOST || 'https://us.i.posthog.com' }}

  macos-tauri:
    name: macOS ${{ matrix.arch }} Cargo Check And Build
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: AppleSilicon
            runner: macos-15
            uname: arm64
          - arch: Intel
            runner: macos-15-intel
            uname: x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify runner architecture
        run: |
          actual="$(uname -m)"
          if [ "$actual" != "${{ matrix.uname }}" ]; then
            echo "Expected ${{ matrix.arch }} runner architecture ${{ matrix.uname }}, got $actual."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install desktop dependencies
        run: npm --prefix apps/desktop ci

      - name: Cargo check
        run: cargo check
        working-directory: apps/desktop/src-tauri

      - name: Build desktop app
        run: npm --prefix apps/desktop run tauri build -- --ci --no-bundle
        env:
          VITE_POSTHOG_PUBLIC_KEY: ${{ secrets.VITE_POSTHOG_PUBLIC_KEY }}
          VITE_POSTHOG_HOST: ${{ secrets.VITE_POSTHOG_HOST || 'https://us.i.posthog.com' }}
