name: macOS Preview Build

on:
  workflow_dispatch:

jobs:
  macos-preview:
    name: Build unsigned macOS ${{ matrix.arch }} artifact
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: AppleSilicon
            runner: macos-15
            uname: arm64
          - arch: Intel
            runner: macos-15-intel
            uname: x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify runner architecture
        run: |
          actual="$(uname -m)"
          if [ "$actual" != "${{ matrix.uname }}" ]; then
            echo "Expected ${{ matrix.arch }} runner architecture ${{ matrix.uname }}, got $actual."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install desktop dependencies
        run: npm --prefix apps/desktop ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm --prefix apps/desktop run lint

      - name: Test frontend
        run: npm run test

      - name: Cargo check
        run: cargo check
        working-directory: apps/desktop/src-tauri

      - name: Build unsigned macOS app
        run: npm --prefix apps/desktop run tauri build -- --ci --no-sign --bundles app,dmg
        env:
          VITE_DISTRIBUTION_CHANNEL: github
          VITE_POSTHOG_PUBLIC_KEY: ${{ secrets.VITE_POSTHOG_PUBLIC_KEY }}
          VITE_POSTHOG_HOST: ${{ secrets.VITE_POSTHOG_HOST || 'https://us.i.posthog.com' }}

      - name: Verify macOS app bundle
        run: |
          app_path="$(find apps/desktop/src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$app_path"
          executable_name="$(plutil -extract CFBundleExecutable raw "$app_path/Contents/Info.plist")"
          test -n "$executable_name"
          test -x "$app_path/Contents/MacOS/$executable_name"
          plutil -extract NSMicrophoneUsageDescription raw "$app_path/Contents/Info.plist" |
            grep -q "Vaak uses the microphone"

      - name: Package macOS app bundle
        run: |
          app_path="$(find apps/desktop/src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$app_path"
          ditto -c -k --sequesterRsrc --keepParent "$app_path" "Vaak-macOS-${{ matrix.arch }}-Preview.app.zip"

      - name: Normalize macOS disk image name
        run: |
          dmg_path="$(find apps/desktop/src-tauri/target/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$dmg_path"
          cp "$dmg_path" "Vaak-macOS-${{ matrix.arch }}-Preview.dmg"

      - name: Upload macOS app bundle
        uses: actions/upload-artifact@v7
        with:
          name: Vaak-macOS-${{ matrix.arch }}-app
          path: Vaak-macOS-${{ matrix.arch }}-Preview.app.zip
          if-no-files-found: error

      - name: Upload macOS disk image
        uses: actions/upload-artifact@v7
        with:
          name: Vaak-macOS-${{ matrix.arch }}-dmg
          path: Vaak-macOS-${{ matrix.arch }}-Preview.dmg
          if-no-files-found: error
