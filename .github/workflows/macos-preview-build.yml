name: macOS Preview Build

on:
  workflow_dispatch:

jobs:
  macos-preview:
    name: Build unsigned macOS artifact
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install desktop dependencies
        run: npm --prefix apps/desktop ci

      - name: Cargo check
        run: cargo check
        working-directory: apps/desktop/src-tauri

      - name: Build unsigned macOS app
        run: npm --prefix apps/desktop run tauri build -- --ci --no-sign --bundles app,dmg
        env:
          VITE_POSTHOG_PUBLIC_KEY: ${{ secrets.VITE_POSTHOG_PUBLIC_KEY }}
          VITE_POSTHOG_HOST: ${{ secrets.VITE_POSTHOG_HOST || 'https://us.i.posthog.com' }}

      - name: Upload macOS app bundle
        uses: actions/upload-artifact@v4
        with:
          name: Vaak-macOS-app
          path: apps/desktop/src-tauri/target/release/bundle/macos/*.app
          if-no-files-found: error

      - name: Upload macOS disk image
        uses: actions/upload-artifact@v4
        with:
          name: Vaak-macOS-dmg
          path: apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
